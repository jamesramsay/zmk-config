on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
      - name: Release 
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          name: nightly
          tag_name: nightly
          files: firmware
          fail_on_unmatched_files: true
